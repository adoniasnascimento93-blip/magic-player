<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d18">
<title>MAGIC PHOTO AR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:14px system-ui,sans-serif}
#cameraPreview{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:0}#arContainer{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:transparent;z-index:1}
#arContainer a-scene{position:absolute!important;inset:0;width:100%!important;height:100%!important;background:transparent!important}
#arContainer canvas{background:transparent!important}
#loading{position:fixed;z-index:5;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(310px,calc(100vw - 48px));padding:13px 16px 12px;border:1px solid #ffffff20;border-radius:15px;background:#101522d9;backdrop-filter:blur(14px);box-shadow:0 8px 35px #0008;transition:opacity .35s,transform .35s}
#loading.done{opacity:0;pointer-events:none;transform:translate(-50%,12px)}
.loadtop{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:9px;color:#dce6fa;font-size:12px}#message{display:none}
#percent{font-variant-numeric:tabular-nums;color:#9eeeff;font-weight:800}
.track{height:4px;border-radius:99px;background:#ffffff20;overflow:hidden}
#fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#8b5cf6,#22d3ee);transition:width .18s ease}
#controls{position:fixed;z-index:4;right:14px;top:max(14px,env(safe-area-inset-top));display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .3s}
#controls.show{opacity:1;pointer-events:auto}
#controls button{border:1px solid #ffffff35;background:#101522b8;color:white;border-radius:99px;padding:10px 13px;font-weight:700;font-size:11px;backdrop-filter:blur(12px)}
#start{display:none}
#error{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100vw - 36px));padding:20px;border-radius:16px;background:#151a28ed;border:1px solid #ffffff30;text-align:center;display:none;line-height:1.5}
#error.show{display:block}
</style>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
<video id="cameraPreview" autoplay muted playsinline></video><div id="arContainer"></div>
<div id="loading">
 <div class="loadtop"><span id="message">Preparando sua experiência…</span><strong id="percent">0%</strong></div>
 <div class="track"><div id="fill"></div></div>
</div>
<div id="controls"><button id="sound">ATIVAR SOM</button><button id="stop">SAIR</button></div>
<div id="error"></div>
<button id="start" aria-hidden="true">INICIAR</button>
<script>
const $=id=>document.getElementById(id);
const CATALOG_URL='./cadastros.json';
let records=[],scene=null,mindUrl=null,videos=[],muted=true,compiled=false,previewStream=null,mindFile='';
const say=(message)=>{$('message').textContent=message};
function progress(value,message){const n=Math.max(0,Math.min(100,Math.round(value)));$('percent').textContent=n+'%';$('fill').style.width=n+'%';if(message)say(message)}
function showError(message){$('error').textContent=message;$('error').classList.add('show');$('loading').classList.remove('done')}
function loadImage(url){return new Promise((resolve,reject)=>{const img=new Image();img.crossOrigin='anonymous';img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Não foi possível carregar uma fotografia. Verifique se o link é público e permite acesso externo (CORS).'));img.src=url})}
function waitForScene(el){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('A câmera demorou para iniciar.')),30000);el.addEventListener('loaded',()=>{clearTimeout(timer);resolve()},{once:true});el.addEventListener('arError',()=>{clearTimeout(timer);reject(new Error('Erro ao iniciar a câmera.'))},{once:true})})}
async function startPreview(){try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Seu navegador não permite abrir a câmera.');previewStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});$('cameraPreview').srcObject=previewStream;await $('cameraPreview').play().catch(()=>{});}catch(e){throw new Error('Não foi possível abrir a câmera. Autorize o acesso e tente novamente. '+(e.message||''))}}
function stopPreview(){if(previewStream){previewStream.getTracks().forEach(t=>t.stop());previewStream=null;}$('cameraPreview').srcObject=null;$('cameraPreview').style.display='none'}
async function loadCatalog(){try{const res=await fetch(CATALOG_URL+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('Não foi possível consultar a lista de fotografias.');const data=await res.json();records=Array.isArray(data.cadastros)?data.cadastros:[];mindFile=typeof data.mindFile==='string'?data.mindFile:'';if(!records.length){say('Ainda não existem fotografias cadastradas.');$('start').disabled=true;return}say(records.length+' fotografia(s) encontrada(s). Preparando a câmera…');}catch(e){say(e.message);$('start').disabled=true}}
async function stopCamera(){if(scene){try{scene.systems['mindar-image-system'].stop()}catch{}scene.remove();scene=null}videos.forEach(v=>{try{v.pause();v.removeAttribute('src');v.load()}catch{}});videos=[];if(mindUrl)URL.revokeObjectURL(mindUrl);mindUrl=null}
$('start').addEventListener('click',async()=>{
 const btn=$('start');btn.disabled=true;
 try{
  if(!records.length)throw new Error('Nenhuma fotografia cadastrada foi encontrada.');
  if(!window.MINDAR||!window.MINDAR.IMAGE||!window.MINDAR.IMAGE.Compiler)throw new Error('A biblioteca de reconhecimento não carregou. Atualize a página.');
  await stopCamera();$('error').classList.remove('show');$('loading').classList.remove('done');$('controls').classList.remove('show');$('cameraPreview').style.display='block';progress(2,'Abrindo câmera…');await startPreview();progress(8,'Câmera aberta. Preparando fotografias…');
  const images=[];for(let i=0;i<records.length;i++){progress(5+20*((i+1)/records.length),'Carregando fotografias '+(i+1)+' de '+records.length+'…');images.push(await loadImage(records[i].photoUrl))}
  progress(27,'Preparando reconhecimento das fotografias…');
  let buffer;
  if(mindFile){
   progress(35,'Carregando reconhecimento já preparado…');
   const prepared=await fetch('./'+encodeURIComponent(mindFile)+'?v='+encodeURIComponent(mindFile),{cache:'force-cache'});
   if(!prepared.ok)throw new Error('O arquivo de reconhecimento preparado não foi encontrado. Abra o painel e prepare novamente.');
   const encoded=(await prepared.text()).trim();
   const binary=atob(encoded);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
   if(mindFile.endsWith('.mind.gz.b64')){
    if(!('DecompressionStream' in window))throw new Error('Seu navegador não oferece suporte para abrir o reconhecimento comprimido. Atualize o Chrome.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    buffer=await new Response(stream).arrayBuffer();
   }else{buffer=bytes.buffer;}
   progress(96,'Reconhecimento carregado!');
  }else{
   const compiler=new window.MINDAR.IMAGE.Compiler();
   await compiler.compileImageTargets(images,p=>progress(27+p*0.68,'Preparando reconhecimento…'));
   progress(96,'Finalizando experiência…');buffer=await compiler.exportData();
  }
  mindUrl=URL.createObjectURL(new Blob([buffer],{type:'application/octet-stream'}));
  const container=$('arContainer');container.innerHTML='';
  const sceneEl=document.createElement('a-scene');
  sceneEl.setAttribute('mindar-image','imageTargetSrc: '+mindUrl+'; autoStart: true; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.01; warmupTolerance: 8; missTolerance: 3');
  sceneEl.setAttribute('embedded','');sceneEl.setAttribute('color-space','sRGB');
  sceneEl.setAttribute('renderer','alpha: true; colorManagement: true; physicallyCorrectLights: false; antialias: true; precision: mediump; powerPreference: high-performance');
  sceneEl.setAttribute('vr-mode-ui','enabled: false');sceneEl.setAttribute('device-orientation-permission-ui','enabled: false');
  sceneEl.style.position='absolute';sceneEl.style.inset='0';sceneEl.style.width='100%';sceneEl.style.height='100%';sceneEl.style.background='transparent';
  const assets=document.createElement('a-assets');
  const camera=document.createElement('a-camera');camera.setAttribute('position','0 0 0');camera.setAttribute('look-controls','enabled: false');
  sceneEl.append(assets,camera);
  records.forEach((record,index)=>{
   const img=images[index],ratio=img.width/img.height,video=document.createElement('video');
   video.id='magicVideo'+index;video.src=record.videoUrl;video.setAttribute('loop','');video.setAttribute('muted','');video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.preload='auto';video.crossOrigin='anonymous';assets.appendChild(video);videos.push(video);
   const target=document.createElement('a-entity');target.setAttribute('mindar-image-target','targetIndex: '+index);
   const plane=document.createElement('a-video');plane.setAttribute('src','#'+video.id);plane.setAttribute('width','1');plane.setAttribute('height',String(1/ratio));plane.setAttribute('position','0 0 0.002');plane.setAttribute('rotation','0 0 0');plane.setAttribute('material','shader: flat; transparent: false; side: double; depthTest: true; depthWrite: true');plane.setAttribute('visible','true');target.appendChild(plane);plane.object3D.visible=false;
   target.addEventListener('targetFound',()=>{plane.object3D.visible=true;say('Fotografia reconhecida: '+record.name);video.play().catch(()=>say('Foto reconhecida: '+record.name+'. Toque em ATIVAR SOM para iniciar o vídeo.'))});
   target.addEventListener('targetLost',()=>{plane.object3D.visible=false;video.pause();say('Aponte para uma das fotografias cadastradas…')});
   sceneEl.appendChild(target);
  });
  stopPreview();container.appendChild(sceneEl);scene=sceneEl;await waitForScene(sceneEl);
  progress(100,'Tudo pronto! Aponte para uma foto.');$('controls').classList.add('show');setTimeout(()=>$('loading').classList.add('done'),650);
 }catch(err){const msg='Não foi possível iniciar: '+(err.message||err);say(msg);showError(msg);stopPreview();await stopCamera()}
 finally{btn.disabled=false}
});
$('sound').addEventListener('click',()=>{muted=!muted;videos.forEach(v=>{v.muted=muted;if(!muted&&!v.paused)v.play().catch(()=>{})});$('sound').textContent=muted?'ATIVAR SOM':'SOM ATIVADO'});
$('stop').addEventListener('click',async()=>{stopPreview();await stopCamera();$('controls').classList.remove('show');progress(0,'Experiência encerrada. Recarregue a página para iniciar novamente.');$('loading').classList.remove('done')});
loadCatalog().then(()=>{
 if(records.length){progress(1,'Preparando sua experiência…');$('start').click()}
});
</script>
</body></html>
